<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e8eeff">
<title>Einkaufen</title>
<style>
:root{
  --acc:#5B5BD6;--acc2:#818CF8;--green:#22C55E;--red:#EF4444;--orange:#F59E0B;
  --text:#1a1a2e;--text2:#374151;--text3:#8B9FC0;
  --bg-from:#e8eeff;--bg-to:#f0e8ff;
  --glass:rgba(255,255,255,0.6);--glass-border:rgba(255,255,255,0.7);
  --glass-shadow:0 8px 32px rgba(91,91,214,0.12);--glass-nav:rgba(255,255,255,0.78);
  --sep:rgba(180,180,220,0.3);--r:18px;--r-sm:12px;--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{overscroll-behavior:none;min-height:100%;background:var(--bg-from);}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;-webkit-font-smoothing:antialiased;background:linear-gradient(135deg,var(--bg-from) 0%,var(--bg-to) 100%);background-attachment:fixed;color:var(--text);min-height:100dvh;overscroll-behavior:none;}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:calc(24px + var(--sb));}
svg{display:inline-block;vertical-align:middle;flex-shrink:0;}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);}
.nav{position:sticky;top:0;z-index:100;background:var(--glass-nav);backdrop-filter:blur(28px) saturate(2);-webkit-backdrop-filter:blur(28px) saturate(2);border-bottom:1px solid var(--glass-border);padding:env(safe-area-inset-top,0) 16px 0;}
.nav-inner{display:flex;align-items:center;gap:8px;height:54px;}
.nav-title{font-size:20px;font-weight:700;letter-spacing:-.5px;flex:1;}
.nav-btn{width:34px;height:34px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0;}
.nav-btn:active{transform:scale(.92);}
.tabs{display:flex;gap:6px;padding:10px 16px;position:sticky;top:54px;z-index:95;background:var(--glass-nav);backdrop-filter:blur(28px) saturate(2);border-bottom:1px solid var(--glass-border);}
.tab-btn{flex:1;padding:9px 8px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--text3);font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.tab-btn.on{background:var(--acc);color:#fff;box-shadow:0 4px 14px rgba(91,91,214,.35);}
/* filter row styled like the tabs above (per request) */
.filter-tabs{display:flex;gap:6px;padding:8px 16px 4px;position:sticky;top:97px;z-index:94;background:var(--glass-nav);backdrop-filter:blur(28px) saturate(2);}
.filter-tabs .tab-btn{font-size:13px;}
.toolbar-row{display:flex;gap:8px;padding:10px 16px 4px;align-items:center;}
.search-wrap{position:relative;flex:1;}
.search-input{width:100%;padding:9px 12px 9px 34px;border-radius:20px;border:1px solid var(--glass-border);background:var(--glass);font-size:14px;color:var(--text);outline:none;}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;}
.fab{width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(91,91,214,.4);flex-shrink:0;}
.fab:active{transform:scale(.92);}
.section{padding:0 16px;margin-top:14px;}
.cat-hdr{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;padding:0 4px 6px;display:flex;justify-content:space-between;}
.cat-box{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--r);overflow:hidden;box-shadow:var(--glass-shadow);}
.item-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--sep);cursor:pointer;}
.item-row:last-child{border-bottom:none;}
.chk{width:23px;height:23px;border-radius:50%;border:2px solid var(--acc);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;transition:all .15s;}
.chk.done{background:var(--acc);}
.item-thumb{width:36px;height:36px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--sep);}
.item-thumb-lg{width:64px;height:64px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--sep);cursor:pointer;}
.item-body{flex:1;min-width:0;}
.item-title{font-size:14.5px;font-weight:600;}
.item-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center;}
.qty-chip{background:var(--sep);border-radius:8px;padding:3px 8px;font-size:11.5px;color:var(--text2);font-weight:600;display:inline-flex;gap:4px;align-items:center;}
.price-tag{font-size:12px;font-weight:600;color:var(--text2);}
.empty-state{text-align:center;padding:60px 24px;color:var(--text3);}
.empty-state svg{margin-bottom:10px;opacity:.5;}
.btn{padding:12px 18px;border-radius:14px;border:none;font-size:14.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;}
.btn-primary{background:var(--acc);color:#fff;box-shadow:0 4px 14px rgba(91,91,214,.35);}
.btn-danger{background:rgba(239,68,68,.12);color:var(--red);}
.btn-ghost{background:var(--glass);color:var(--text2);border:1px solid var(--glass-border);}
.btn-sm{width:auto;padding:9px 14px;font-size:13px;}
/* meal plan */
.day-grid{display:flex;flex-direction:column;gap:8px;padding:14px 16px;}
.day-row{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:12px 14px;cursor:pointer;}
.day-label{width:38px;font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;flex-shrink:0;}
.day-val{flex:1;font-size:14px;font-weight:600;color:var(--text2);}
.day-val.empty{color:var(--text3);font-weight:500;}
.recipe-hdr{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;padding:10px 4px 8px;}
.recipe-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer;}
.recipe-card:active{transform:scale(.98);}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,20,40,.4);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s;}
.ov.open{opacity:1;pointer-events:auto;}
.ov.ov2{z-index:600;}
.sheet{background:var(--bg-from);width:100%;max-width:480px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + var(--sb));transform:translateY(20px);transition:transform .25s;max-height:88vh;overflow-y:auto;}
.ov.open .sheet{transform:translateY(0);}
.mhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.mtitle{font-size:17px;font-weight:700;}
.mclose{color:var(--acc);font-size:14px;font-weight:600;cursor:pointer;}
.field{margin-bottom:12px;}
.field label{font-size:12px;font-weight:600;color:var(--text3);display:block;margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--glass-border);background:#fff;font-size:14.5px;color:var(--text);outline:none;font-family:inherit;}
.field textarea{resize:vertical;min-height:60px;}
.toast{position:fixed;bottom:calc(24px + var(--sb));left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:11px 20px;border-radius:14px;font-size:13.5px;font-weight:600;z-index:900;opacity:0;transition:all .25s;pointer-events:none;max-width:88%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--bg-from),var(--bg-to));z-index:1000;}
.spin{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:24px;padding:28px 24px;width:100%;max-width:360px;box-shadow:var(--glass-shadow);}
.login-card h1{font-size:20px;margin-bottom:4px;}
.login-card p{font-size:13px;color:var(--text3);margin-bottom:18px;}
/* photos */
.photo-gallery{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.photo-thumb-wrap{position:relative;width:64px;height:64px;}
.photo-thumb-wrap img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:1px solid var(--glass-border);}
.photo-remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25);}
.photo-add-btn{width:64px;height:64px;border-radius:12px;border:2px dashed var(--glass-border);background:var(--glass);display:flex;align-items:center;justify-content:center;color:var(--text3);cursor:pointer;flex-direction:column;gap:2px;font-size:10px;font-weight:600;}
/* auto-suggest grid */
.img-suggest-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 4px;}
.img-suggest-item{border-radius:12px;overflow:hidden;border:3px solid transparent;cursor:pointer;position:relative;aspect-ratio:1;background:var(--sep);}
.img-suggest-item img{width:100%;height:100%;object-fit:cover;display:block;}
.img-suggest-item.sel{border-color:var(--acc);}
.img-suggest-item.sel::after{content:'✓';position:absolute;top:3px;right:3px;width:18px;height:18px;background:var(--acc);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.img-suggest-loading{font-size:12px;color:var(--text3);padding:4px 0 8px;display:flex;align-items:center;gap:6px;}
.img-suggest-skip{font-size:12px;color:var(--acc);cursor:pointer;font-weight:600;padding:2px 0 10px;display:inline-block;}
.photo-pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 16px;}
.photo-pick-item{border-radius:14px;overflow:hidden;border:3px solid transparent;cursor:pointer;position:relative;aspect-ratio:1;}
.photo-pick-item img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-pick-item.sel{border-color:var(--acc);}
.photo-pick-item.sel::after{content:'✓';position:absolute;top:4px;right:4px;width:20px;height:20px;background:var(--acc);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
</style>
</head>
<body>

<div id="loadingScreen" class="loader"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#5B5BD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></div>

<div id="loginScreen" style="display:none">
  <div class="login-wrap">
    <div class="login-card">
      <h1>Einkaufen</h1>
      <p>Melde dich mit deinem TaskFlow-Namen an.</p>
      <div class="field"><label>Name</label><input id="loginName" type="text" placeholder="Dein Name" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn btn-primary" onclick="doLogin()">Anmelden</button>
      <div id="loginErr" style="color:var(--red);font-size:12.5px;margin-top:10px;text-align:center"></div>
    </div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="nav">
    <div class="nav-inner">
      <div class="nav-title">Einkaufen</div>
      <button class="nav-btn" onclick="manualRefresh()" title="Aktualisieren"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
      <button class="nav-btn" onclick="doLogout()" title="Abmelden"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn on" id="tabBtnPlan" onclick="setMainTab('plan')">Essensplan</button>
    <button class="tab-btn" id="tabBtnShop" onclick="setMainTab('shop')">Einkaufen</button>
    <button class="tab-btn" id="tabBtnRecipes" onclick="setMainTab('recipes')">Rezepte</button>
  </div>

  <!-- SHOP TAB (filters + list) -->
  <div id="shopTab" style="display:none">
    <div class="filter-tabs">
      <button class="tab-btn on" id="filterBtnAll" onclick="setFilter('all')">Einkauf planen</button>
      <button class="tab-btn" id="filterBtnChecked" onclick="setFilter('checked')">Einkaufen</button>
    </div>
    <div class="toolbar-row" id="toolbarRow">
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="searchInput" placeholder="Suchen…" oninput="onSearch(this.value)">
      </div>
      <button class="fab" onclick="openAddItem()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
    <div id="listContainer"></div>
  </div>

  <!-- PLAN TAB -->
  <div id="planTab">
    <div class="day-grid" id="dayGrid"></div>
    <div class="recipe-area" id="recipeArea" style="display:none;padding:6px 16px 20px">
      <div class="recipe-hdr">Rezeptvorschläge</div>
      <div id="recipeList"></div>
    </div>
  </div>

  <!-- RECIPES TAB -->
  <div id="recipesTab" style="display:none">
    <div class="recipe-hdr">Meine Rezepte</div>
    <div class="recipe-grid" id="recipeGrid"></div>
  </div>
</div>

<!-- Item modal -->
<div class="ov" id="itemModal">
  <div class="sheet">
    <div class="mhdr"><div class="mtitle" id="itemModalTitle">Artikel hinzufügen</div><span class="mclose" onclick="closeItemModal()">Abbrechen</span></div>
    <div class="field"><label>Titel</label><input id="fTitle" placeholder="z.B. Milch" oninput="onTitleInputChange(this.value)"></div>
    <div class="field" id="imgSuggestField" style="display:none">
      <label>Bildvorschläge</label>
      <div id="imgSuggestLoading" class="img-suggest-loading" style="display:none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>Suche Bilder…
      </div>
      <div class="img-suggest-grid" id="imgSuggestGrid"></div>
      <span class="img-suggest-skip" onclick="skipImgSuggest()">Ohne Bild fortfahren</span>
    </div>
    <div class="field">
      <label>Eigene Fotos (bis zu 5)</label>
      <div class="photo-gallery" id="photoGallery"></div>
      <input type="file" id="photoInp" accept="image/*" style="display:none" onchange="handlePhotoInput(this)">
    </div>
    <div class="field"><label>Kategorie</label><select id="fCat"></select></div>
    <div style="display:flex;gap:10px">
      <div class="field" style="flex:1"><label>Menge</label><input id="fQty" placeholder="1"></div>
      <div class="field" style="flex:1"><label>Preis (€)</label><input id="fPrice" placeholder="optional" inputmode="decimal"></div>
    </div>
    <div class="field"><label>Notiz</label><input id="fComment" placeholder="optional"></div>
    <button class="btn btn-primary" onclick="saveItem()">Speichern</button>
    <div id="delItemWrap" style="margin-top:8px"></div>
  </div>
</div>

<!-- Photo picker modal (shown when checking an item with >1 photo) -->
<div class="ov ov2" id="photoPickModal">
  <div class="sheet">
    <div class="mhdr"><div class="mtitle">Welche Sorte?</div><span class="mclose" onclick="closePhotoPick()">Abbrechen</span></div>
    <div class="photo-pick-grid" id="photoPickGrid"></div>
  </div>
</div>

<!-- Meal modal -->
<div class="ov" id="mealModal">
  <div class="sheet">
    <div class="mhdr"><div class="mtitle" id="mealModalDay">Montag</div><span class="mclose" onclick="closeMealModal()">Abbrechen</span></div>
    <div class="field"><label>Gericht</label><input id="mealText" placeholder="z.B. Spaghetti Bolognese"></div>
    <button class="btn btn-primary" onclick="searchMealRecipes()">Suchen</button>
    <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px" onclick="saveMealFreeText()">Ohne Rezept speichern</button>
    <div id="delMealWrap" style="margin-top:8px"></div>
    <div id="mealSearchResults" style="margin-top:16px"></div>
  </div>
</div>

<!-- Ingredient import review modal -->
<div class="ov ov2" id="ingredientModal">
  <div class="sheet">
    <div class="mhdr"><div class="mtitle">Zutaten übernehmen</div><span class="mclose" onclick="closeIngredientModal()">Abbrechen</span></div>
    <p style="font-size:13px;color:var(--text3);margin-bottom:12px" id="ingredientDesc"></p>
    <div id="ingredientList"></div>
    <button class="btn btn-primary" onclick="confirmIngredientImport()" style="margin-top:4px">Zur Einkaufsliste hinzufügen</button>
  </div>
</div>

<!-- Foto Zoom Overlay -->
<div id="photoZoomOv" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:800;align-items:center;justify-content:center;padding:24px" onclick="closePhotoZoom()">
  <img id="photoZoomImg" style="max-width:100%;max-height:90dvh;border-radius:16px;object-fit:contain;box-shadow:0 8px 40px rgba(0,0,0,.6)">
</div>

<div class="toast" id="toast"></div>

<!-- Rezept-Modal -->
<div class="ov" id="recipeModal">
  <div class="sheet">
    <div class="mhdr">
      <div class="mtitle" id="recipeModalTitle">Rezept hinzufügen</div>
      <span class="mclose" onclick="closeRecipeModal()">Abbrechen</span>
    </div>
    <div class="field">
      <label>Name</label>
      <input id="fRecipeTitle" placeholder="z.B. Spaghetti Bolognese">
    </div>
    <div class="field">
      <label>Bild</label>
      <input type="file" id="recipeImageInp" accept="image/*" onchange="handleRecipeImageInput(this)">
    </div>
    <div class="field">
      <label>Kategorie</label>
      <select id="fRecipeCat"></select>
    </div>
    <div class="field">
      <label>Artikel</label>
      <textarea id="fRecipeItems" placeholder="Zutaten, eine pro Zeile"></textarea>
    </div>
    <button class="btn btn-primary" onclick="saveRecipe()">Speichern</button>
    <div id="delRecipeWrap" style="margin-top:8px"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════
let myToken = null;
async function api(method, path, body) {
  const opts = {
    method,
    headers: {
      'Content-Type': 'application/json',
      'x-token': myToken || ''
    }
  };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch('/api' + path, opts);
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    throw new Error(e.error || r.statusText);
  }
  return r.json();
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}
function hideLoader() {
  document.getElementById('loadingScreen').style.display = 'none';
}
async function init() {
  myToken = localStorage.getItem('tf_token');
  if (myToken) {
    try {
      await api('GET', '/users/me');
      hideLoader();
      showAppUI();
      return;
    } catch (e) {
      localStorage.removeItem('tf_token');
      myToken = null;
    }
  }
  hideLoader();
  document.getElementById('loginScreen').style.display = 'block';
}
async function doLogin() {
  const name = document.getElementById('loginName').value.trim();
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  if (!name) {
    errEl.textContent = 'Bitte Namen eingeben';
    return;
  }
  try {
    const d = await api('POST', '/users/login', { username: name });
    myToken = d.token; localStorage.setItem('tf_token', myToken);
    document.getElementById('loginScreen').style.display = 'none';
    showAppUI();
  } catch (e) {
    errEl.textContent = e.message || 'Anmeldung fehlgeschlagen';
  }
}
function doLogout() {
  if (!confirm('Wirklich abmelden?')) return;
  localStorage.removeItem('tf_token'); myToken = null; location.reload();
}
function showAppUI() {
  document.getElementById('app').style.display = 'block';
  populateCatSelect();
  populateRecipeCatSelect();
  ensureShopSynced().then(() => { renderAll(); setTimeout(() => autoFillExistingItems(), 2000); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pollOnce(); });
  startPolling();
}

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
const SHOP_CATS = ['Nudeln, Backware', 'Soßen & Gewürze', 'Öl & Essig', 'Obst', 'Gemüse', 'Kräuter', 'Alkohol', 'Asia & Sonstiges', 'Dosen & Kaffee', 'Brot & Wurst', 'TK', 'Fleisch', 'Süßkram', 'Käse & Kühlregal', 'Getränke', 'Drogerie', 'Kassenbereich'];
const WEEKDAY_KEYS = ['mo', 'di', 'mi', 'do', 'fr', 'sa', 'so'];
const WEEKDAY_LABELS = { mo: 'Mo', di: 'Di', mi: 'Mi', do: 'Do', fr: 'Fr', sa: 'Sa', so: 'So' };
const WEEKDAY_NAMES = { mo: 'Montag', di: 'Dienstag', mi: 'Mittwoch', do: 'Donnerstag', fr: 'Freitag', sa: 'Samstag', so: 'Sonntag' };
let shopItems = [];
let mealPlan = {};
let recipes = [];
let mainTab = 'plan'; // 'plan' (Essensplan) | 'shop' (Einkaufsliste) | 'recipes' (Rezepte)
let listFilter = 'all'; // 'all' (Einkauf planen) | 'checked' (Einkaufsliste)
let searchQuery = '';
let editingId = null;
let editingMealKey = null;
let editingPhotos = []; // photos currently in the add/edit item modal, before save

const pendingWrites = new Map();
const pendingDeletes = new Set();
const pendingMealKeys = new Set();
function beginPending(id) { id = String(id); pendingWrites.set(id, (pendingWrites.get(id) || 0) + 1); }
function endPending(id) { id = String(id); const c = (pendingWrites.get(id) || 1) - 1; if (c <= 0) pendingWrites.delete(id); else pendingWrites.set(id, c); }

let shopHash = null, mealHash = null, shrinkSuspectCount = 0;
let expandedCats = new Set(); // categories expanded in the "Einkauf planen" view; empty = all collapsed

function populateCatSelect() {
  document.getElementById('fCat').innerHTML = SHOP_CATS.map(c => `<option value="${c}">${c}</option>`).join('');
}

function populateRecipeCatSelect() {
  document.getElementById('fRecipeCat').innerHTML = RECIPE_CATS.map(c => `<option value="${c}">${c}</option>`).join('');
}

function getItemPhotos(item) {
  if (item.photos && item.photos.length) return item.photos;
  if (item.photo) return [item.photo];
  return [];
}

// ══════════════════════════════════════════
// SYNC
// ══════════════════════════════════════════
function mergeItems(fresh) {
  const freshById = new Map(fresh.map(i => [String(i.id || i._id), i]));
  const localById = new Map(shopItems.map(i => [String(i.id || i._id), i]));
  const merged = [];
  freshById.forEach((freshItem, id) => {
    if (pendingDeletes.has(id)) return;
    if (pendingWrites.has(id) && localById.has(id)) merged.push(localById.get(id));
    else merged.push(freshItem);
  });
  localById.forEach((localItem, id) => {
    if (!freshById.has(id) && !pendingDeletes.has(id) && pendingWrites.has(id)) merged.push(localItem);
  });
  return merged;
}

function mergeMealPlan(fresh) {
  const merged = { ...(fresh || {}) };
  pendingMealKeys.forEach(k => { if (k in mealPlan) merged[k] = mealPlan[k]; });
  return merged;
}

function hashItems(items) { return items.length + '|' + items.map(i => (i.id || i._id) + '=' + (i.checked ? 1 : 0)).sort().join(','); }

let _initPromise = null;
function ensureShopSynced() {
  if (!_initPromise) {
    _initPromise = (async () => {
      try {
        const [items, plan, r] = await Promise.all([api('GET', '/shopping'), api('GET', '/mealplan'), api('GET', '/recipes')]);
        shopItems = items || [];
        mealPlan = plan || {};
        recipes = r || [];
        shopHash = hashItems(shopItems);
        mealHash = JSON.stringify(mealPlan);
      } catch (e) { showToast('Konnte nicht laden: ' + e.message); }
    })();
  }
  return _initPromise;
}

async function manualRefresh() { await pollOnce(true); showToast('Aktualisiert'); }
async function pollOnce(force) {
  try {
    const [fresh, freshPlan, freshRecipes] = await Promise.all([api('GET', '/shopping'), api('GET', '/mealplan'), api('GET', '/recipes')]);
    const newHash = hashItems(fresh);
    if (newHash !== shopHash || force) {
      const looksLikeGlitch = shopItems.length > 5 && fresh.length < shopItems.length * 0.5;
      if (looksLikeGlitch && shrinkSuspectCount < 1) { shrinkSuspectCount++; }
      else {
        shrinkSuspectCount = 0; shopHash = newHash;
        shopItems = mergeItems(fresh);
        if (mainTab === 'shop') renderList();
      }
    }
    const newPlanHash = JSON.stringify(freshPlan || {});
    if (newPlanHash !== mealHash) {
      mealHash = newPlanHash;
      if (!document.getElementById('mealModal').classList.contains('open')) {
        mealPlan = mergeMealPlan(freshPlan);
        if (mainTab === 'plan') renderMealGrid();
      }
    }
    const newRecipesHash = JSON.stringify(freshRecipes || {});
    if (newRecipesHash !== recipesHash) {
      recipesHash = newRecipesHash;
      if (!document.getElementById('recipeModal').classList.contains('open')) {
        recipes = freshRecipes;
        if (mainTab === 'recipes') renderRecipeGrid();
      }
    }
  } catch (e) {/* transient network errors ignored - next tick retries */}
}
function startPolling() { setInterval(pollOnce, 5000); }

// ══════════════════════════════════════════
// TABS / FILTERS
// ══════════════════════════════════════════
function setMainTab(t) {
  mainTab = t;
  document.getElementById('tabBtnPlan').classList.toggle('on', t === 'plan');
  document.getElementById('tabBtnShop').classList.toggle('on', t === 'shop');
  document.getElementById('tabBtnRecipes').classList.toggle('on', t === 'recipes');
  document.getElementById('planTab').style.display = t === 'plan' ? '' : 'none';
  document.getElementById('shopTab').style.display = t === 'shop' ? '' : 'none';
  document.getElementById('recipesTab').style.display = t === 'recipes' ? '' : 'none';
  renderAll();
}
function setFilter(f) {
  listFilter = f;
  document.getElementById('filterBtnAll').classList.toggle('on', f === 'all');
  document.getElementById('filterBtnChecked').classList.toggle('on', f === 'checked');
  document.getElementById('toolbarRow').style.display = f === 'all' ? '' : 'none';
  renderList();
}
function onSearch(v) { searchQuery = v.trim().toLowerCase(); renderList(); }
function renderAll() {
  if (mainTab === 'shop') renderList();
  else if (mainTab === 'plan') renderMealGrid();
  else if (mainTab === 'recipes') renderRecipeGrid();
}
function escHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ══════════════════════════════════════════
// SHOPPING LIST
// ══════════════════════════════════════════
function renderList() {
  const container = document.getElementById('listContainer');
  if (!shopItems.length) {
    container.innerHTML = '<div class="empty-state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><div>Noch keine Artikel</div><div style="font-size:12.5px;margin-top:2px">Tipp oben rechts auf + zum Anlegen</div></div>';
    return;
  }
  const byCat = {}; SHOP_CATS.forEach(c => byCat[c] = []);
  shopItems.forEach(i => { const c = i.category || SHOP_CATS[0]; if (!byCat[c]) byCat[c] = []; byCat[c].push(i); });
  Object.values(byCat).forEach(arr => arr.sort((a, b) => a.title.localeCompare(b.title, 'de')));
  let html = '';
  let anyVisible = false;
  const collapsible = listFilter === 'all'; // only the full-catalog view collapses; the checked list stays flat
  SHOP_CATS.forEach(cat => {
    const all = byCat[cat]; if (!all || !all.length) return;
    let vis = listFilter === 'checked' ? all.filter(i => i.checked) : all;
    if (searchQuery) vis = vis.filter(i => i.title.toLowerCase().includes(searchQuery));
    if (!vis.length) return;
    anyVisible = true;
    const count = listFilter === 'checked' ? `${vis.length} auf der Liste` : `${all.length} im Katalog`;
    // while searching, force the category open so results are visible without an extra tap
    const isOpen = !collapsible || searchQuery || expandedCats.has(cat);
    const chevron = collapsible ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transition:transform .15s;transform:rotate(${isOpen ? 90 : 0}deg)"><polyline points="9 18 15 12 9 6"/></svg>` : '';
    const hdrClick = collapsible ? ` onclick="toggleCatCollapse('${cat.replace(/'/g, "\\'")}')" style="cursor:pointer"` : '';
    html += `<div class="section"><div class="cat-hdr"${hdrClick}><span style="display:flex;align-items:center;gap:6px">${chevron}${cat}</span><span>${count}</span></div>`;
    if (!isOpen) { html += '</div>'; return; }
    html += '<div class="cat-box">';
    vis.forEach(item => {
      const sid = item.id || item._id;
      const photos = getItemPhotos(item);
      const selIdx = typeof item.selectedPhotoIndex === 'number' && photos[item.selectedPhotoIndex] ? item.selectedPhotoIndex : 0;
      const displayPhoto = photos[selIdx] || photos[0] || null;
      const isCheckedView = listFilter === 'checked';
      const thumb = displayPhoto
        ? (isCheckedView
          ? `<img class="item-thumb-lg" src="${displayPhoto}" onclick="openPhotoZoom('${sid}', event)">`
          : `<img class="item-thumb" src="${displayPhoto}">`)
        : '';
      html += `<div class="item-row">
        <div class="chk${item.checked ? ' done' : ''}" onclick="toggleItem('${sid}', event)">${item.checked ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>''}</div>
        <div class="item-body" onclick="openEditItem('${sid}')">
          <div class="item-title">${escHtml(item.title)}${item.comment ? ` <em style="color:var(--text3);font-weight:400;font-style:normal;font-size:12.5px">${escHtml(item.comment)}</em>` : ''}</div>
          <div class="item-meta">
            <span class="qty-chip">${escHtml(item.qty || '1')}</span>
            ${item.price ? `<span class="price-tag">${parseFloat(item.price).toFixed(2)} €</span>` : ''}
          </div>
        </div>
        ${thumb}
      </div>`;
    });
    html += '</div></div>';
  });
  container.innerHTML = anyVisible ? html : '<div class="empty-state">Keine Treffer</div>';
}
function toggleCatCollapse(cat) {
  if (expandedCats.has(cat)) expandedCats.delete(cat); else expandedCats.add(cat);
  renderList();
}

// ── checking an item: mandatory photo pick if it has >1 photo ──
let _pendingCheckId = null;
async function toggleItem(id, e) {
  if (e) e.stopPropagation();
  const item = shopItems.find(i => (i.id || i._id) === id);
  if (!item) return;
  if (!item.checked) {
    const photos = getItemPhotos(item);
    if (photos.length > 1) {
      openPhotoPick(id);
      return; // actual checking happens in confirmPhotoPick()
    }
  }
  await doToggle(id);
}
// Always send a complete, known-good snapshot of the item's fields on every PATCH -
// protects against a backend PATCH handler that replaces the document instead of
// merging fields (which was silently wiping photos on every checked-toggle before).
function buildFullPatch(item, overrides) {
  return {
    title: item.title, category: item.category, qty: item.qty || '', price: item.price || '',
    comment: item.comment || '', repeat: item.repeat || { type: 'always', n: 0 },
    photos: getItemPhotos(item),
    checked: item.checked,
    selectedPhotoIndex: typeof item.selectedPhotoIndex === 'number' ? item.selectedPhotoIndex : null,
    ...overrides
  };
}
async function doToggle(id, selectedPhotoIndex) {
  const item = shopItems.find(i => (i.id || i._id) === id);
  if (!item) return;
  item.checked = !item.checked;
  if (item.checked && typeof selectedPhotoIndex === 'number') item.selectedPhotoIndex = selectedPhotoIndex;
  const patch = buildFullPatch(item);
  beginPending(id);
  renderList();
  try { await api('PATCH', '/shopping/' + id, patch); }
  catch (ex) { item.checked = !item.checked; renderList(); showToast('Fehler beim Speichern'); }
  finally { endPending(id); }
}
function openPhotoPick(id) {
  _pendingCheckId = id;
  beginPending(id); // guard against pollOnce overwriting photos while picker is open
  const item = shopItems.find(i => (i.id || i._id) === id);
  const photos = getItemPhotos(item);
  const grid = document.getElementById('photoPickGrid');
  const preselect = typeof item.selectedPhotoIndex === 'number' ? item.selectedPhotoIndex : 0;
  grid.innerHTML = photos.map((p, idx) => `<div class="photo-pick-item${idx === preselect ? ' sel' : ''}" data-idx="${idx}" onclick="pickPhotoIdx(${idx})"><img src="${p}"></div>`).join('');
  grid.dataset.sel = preselect;
  document.getElementById('photoPickModal').classList.add('open');
}
function pickPhotoIdx(idx) {
  const grid = document.getElementById('photoPickGrid');
  grid.dataset.sel = idx;
  grid.querySelectorAll('.photo-pick-item').forEach(el => el.classList.toggle('sel', Number(el.dataset.idx) === idx));
  // confirm immediately on tap
  const id = _pendingCheckId;
  document.getElementById('photoPickModal').classList.remove('open');
  _pendingCheckId = null;
  endPending(id); // release the guard set by openPhotoPick; doToggle will set its own
  doToggle(id, idx);
}
function openPhotoZoom(id, e) {
  if (e) e.stopPropagation();
  const item = shopItems.find(i => (i.id || i._id) === id); if (!item) return;
  const photos = getItemPhotos(item);
  const selIdx = typeof item.selectedPhotoIndex === 'number' && photos[item.selectedPhotoIndex] ? item.selectedPhotoIndex : 0;
  const src = photos[selIdx] || photos[0]; if (!src) return;
  document.getElementById('photoZoomImg').src = src;
  const ov = document.getElementById('photoZoomOv');
  ov.style.display = 'flex';
}
function closePhotoZoom() {
  document.getElementById('photoZoomOv').style.display = 'none';
  document.getElementById('photoZoomImg').src = '';
}
function closePhotoPick() {
  document.getElementById('photoPickModal').classList.remove('open');
  if (_pendingCheckId) { endPending(_pendingCheckId); _pendingCheckId = null; }
}

// ── add/edit item + photos ──
function openAddItem() {
  editingId = null; editingPhotos = []; _suggestSelected = null; _suggestUrls = [];
  document.getElementById('itemModalTitle').textContent = 'Artikel hinzufügen';
  document.getElementById('fTitle').value = '';
  document.getElementById('fCat').value = SHOP_CATS[0];
  document.getElementById('fQty').value = '';
  document.getElementById('fPrice').value = '';
  document.getElementById('fComment').value = '';
  document.getElementById('delItemWrap').innerHTML = '';
  document.getElementById('imgSuggestField').style.display = 'none';
  document.getElementById('imgSuggestGrid').innerHTML = '';
  renderPhotoGallery();
  document.getElementById('itemModal').classList.add('open');
  setTimeout(() => document.getElementById('fTitle').focus(), 250);
}
function openEditItem(id) {
  const item = shopItems.find(i => (i.id || i._id) === id); if (!item) return;
  editingId = id; editingPhotos = [...getItemPhotos(item)]; _suggestSelected = null; _suggestUrls = [];
  beginPending(id);
  document.getElementById('itemModalTitle').textContent = 'Artikel bearbeiten';
  document.getElementById('fTitle').value = item.title || '';
  document.getElementById('fCat').value = item.category || SHOP_CATS[0];
  document.getElementById('fQty').value = item.qty || '';
  document.getElementById('fPrice').value = item.price || '';
  document.getElementById('fComment').value = item.comment || '';
  document.getElementById('delItemWrap').innerHTML = '<button class="btn btn-danger" onclick="deleteItem()">Artikel löschen</button>';
  document.getElementById('imgSuggestField').style.display = 'none';
  document.getElementById('imgSuggestGrid').innerHTML = '';
  renderPhotoGallery();
  document.getElementById('itemModal').classList.add('open');
}
function renderPhotoGallery() {
  const g = document.getElementById('photoGallery');
  let html = editingPhotos.map((p, idx) => `<div class="photo-thumb-wrap"><img src="${p}"><div class="photo-remove" onclick="removePhotoAt(${idx})">✕</div></div>`).join('');
  if (editingPhotos.length < 5) {
    html += `<div class="photo-add-btn" onclick="document.getElementById('photoInp').click()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Foto</div>`;
  }
  g.innerHTML = html;
}
function removePhotoAt(idx) { editingPhotos.splice(idx, 1); renderPhotoGallery(); }
// compress/resize an image file down to a reasonable size before storing as base64
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 640;
        let w = img.width, h = img.height;
        if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
        else if (h >= w && h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handlePhotoInput(inp) {
  const file = inp.files[0]; inp.value = ''; if (!file) return;
  if (editingPhotos.length >= 5) { showToast('Maximal 5 Fotos pro Artikel'); return; }
  try {
    const compressed = await compressImage(file);
    editingPhotos.push(compressed);
    renderPhotoGallery();
  } catch (e) { showToast('Foto konnte nicht verarbeitet werden'); }
}
// ── AUTO IMAGE SUGGEST ──────────────────────────────────────────
let _suggestSelected = null; // index in _suggestUrls or null
let _suggestUrls = [];
let _titleDebounce = null;

function onTitleInputChange(val) {
  if (editingId) return; // nur beim Neuanlegen
  clearTimeout(_titleDebounce);
  const q = val.trim();
  if (q.length < 2) {
    document.getElementById('imgSuggestField').style.display = 'none';
    _suggestUrls = []; _suggestSelected = null;
    return;
  }
  _titleDebounce = setTimeout(() => fetchSuggestImages(q), 300);
}

async function fetchSuggestImages(query) {
  try {
    const response = await fetch(`/api/suggest-images?q=${encodeURIComponent(query)}`);
    const images = await response.json();
    if (images.length > 0) {
      document.getElementById('imgSuggestField').style.display = '';
      document.getElementById('imgSuggestGrid').innerHTML = images.map(img => `<img src="${img}" onclick="selectSuggestedImage('${img}')">`).join('');
    } else {
      document.getElementById('imgSuggestField').style.display = 'none';
    }
  } catch (error) {
    console.error('Fehler beim Abrufen der Bildvorschläge:', error);
  }
}

function selectSuggestedImage(imageUrl) {
  editingPhotos.push(imageUrl);
  renderPhotoGallery();
}

function skipImgSuggest() {
  document.getElementById('imgSuggestField').style.display = 'none';
}

// ── save item ──
async function saveItem() {
  const title = document.getElementById('fTitle').value.trim();
  const category = document.getElementById('fCat').value;
  const quantity = document.getElementById('fQty').value.trim();
  const price = document.getElementById('fPrice').value.trim();
  const comment = document.getElementById('fComment').value.trim();

  if (!title || !category) {
    showToast('Bitte Titel und Kategorie eingeben');
    return;
  }

  const newItem = {
    title,
    category,
    qty: quantity || null,
    price: price ? parseFloat(price) : null,
    comment,
    photos: editingPhotos,
    checked: false,
  };

  try {
    if (editingId) {
      await api('PATCH', `/shopping/${editingId}`, newItem);
      showToast('Artikel aktualisiert');
    } else {
      await api('POST', '/shopping', newItem);
      showToast('Artikel hinzugefügt');
    }
    closeItemModal();
    renderList();
  } catch (error) {
    console.error('Fehler beim Speichern des Artikels:', error);
    showToast('Fehler beim Speichern');
  }
}

// ── delete item ──
async function deleteItem() {
  if (!confirm('Wollen Sie diesen Artikel wirklich löschen?')) return;
  try {
    await api('DELETE', `/shopping/${editingId}`);
    closeItemModal();
    renderList();
  } catch (error) {
    console.error('Fehler beim Löschen des Artikels:', error);
    showToast('Fehler beim Löschen');
  }
}

// ── photo pick ──
function openPhotoPick(id) {
  _pendingCheckId = id;
  beginPending(id);
  const item = shopItems.find(i => i.id === id);
  if (item && item.photos && item.photos.length > 1) {
    const grid = document.getElementById('photoPickGrid');
    grid.innerHTML = item.photos.map((p, idx) => `<img src="${p}" onclick="pickPhoto(${idx})" class="photo-pick-item${idx === item.selectedPhotoIndex ? ' selected' : ''}">`).join('');
    document.getElementById('photoPickModal').classList.add('open');
  }
}

function pickPhoto(idx) {
  const item = shopItems.find(i => i.id === _pendingCheckId);
  if (item) {
    item.selectedPhotoIndex = idx;
    endPending(_pendingCheckId);
    document.getElementById('photoPickModal').classList.remove('open');
  }
}

// ── recipe ──
function renderRecipeGrid() {
  const container = document.getElementById('recipeGrid');
  container.innerHTML = recipes.map(recipe => `
    <div class="recipe-card" onclick="openRecipe(${recipe.id})">
      <img src="${recipe.imageUrl}" alt="${recipe.title}">
      <div class="recipe-info">
        <h3>${recipe.title}</h3>
        <p>${recipe.category}</p>
      </div>
    </div>
  `).join('');
}

function openRecipe(recipeId) {
  const recipe = recipes.find(r => r.id === recipeId);
  if (recipe) {
    document.getElementById('fRecipeTitle').value = recipe.title;
    document.getElementById('recipeImageInp').value = ''; // Placeholder for image handling
    document.getElementById('fRecipeCat').value = recipe.category;
    document.getElementById('fRecipeItems').value = recipe.items.join('\n');
    document.getElementById('recipeModalTitle').textContent = 'Rezept bearbeiten';
    document.getElementById('delRecipeWrap').innerHTML = `<button class="btn btn-danger" onclick="deleteRecipe(${recipeId})">Rezept löschen</button>`;
    document.getElementById('recipeModal').classList.add('open');
  }
}

async function saveRecipe() {
  const title = document.getElementById('fRecipeTitle').value.trim();
  const image = document.getElementById('recipeImageInp').files[0];
  const category = document.getElementById('fRecipeCat').value;
  const itemsText = document.getElementById('fRecipeItems').value.trim();
  const items = itemsText.split('\n').map(item => item.trim()).filter(item => item);

  if (!title || !category || items.length === 0) {
    showToast('Bitte alle Felder ausfüllen');
    return;
  }

  const formData = new FormData();
  formData.append('title', title);
  formData.append('image', image);
  formData.append('category', category);
  formData.append('items', JSON.stringify(items));

  try {
    if (editingRecipeId) {
      await api('PATCH', `/recipes/${editingRecipeId}`, formData);
      showToast('Rezept aktualisiert');
    } else {
      await api('POST', '/recipes', formData);
      showToast('Rezept hinzugefügt');
    }
    closeRecipeModal();
    renderRecipeGrid();
  } catch (error) {
    console.error('Fehler beim Speichern des Rezepts:', error);
    showToast('Fehler beim Speichern');
  }
}

function closeRecipeModal() {
  document.getElementById('recipeModal').classList.remove('open');
  document.getElementById('fRecipeTitle').value = '';
  document.getElementById('recipeImageInp').value = '';
  document.getElementById('fRecipeCat').value = RECIPE_CATS[0];
  document.getElementById('fRecipeItems').value = '';
  document.getElementById('recipeModalTitle').textContent = 'Rezept hinzufügen';
  document.getElementById('delRecipeWrap').innerHTML = '';
  editingRecipeId = null;
}

function deleteRecipe(recipeId) {
  if (!confirm('Wollen Sie dieses Rezept wirklich löschen?')) return;
  try {
    await api('DELETE', `/recipes/${recipeId}`);
    closeRecipeModal();
    renderRecipeGrid();
  } catch (error) {
    console.error('Fehler beim Löschen des Rezepts:', error);
    showToast('Fehler beim Löschen');
  }
}

// ── meal plan ──
async function addRecipeItemsToShoppingList(recipeId) {
  const recipe = recipes.find(r => r.id === recipeId);
  if (recipe) {
    recipe.items.forEach(item => {
      const newItem = {
        title: item,
        category: recipe.category,
        checked: false,
      };
      api('POST', '/shopping', newItem);
    });
    showToast('Zutaten hinzugefügt');
    renderList();
  }
}

init();
</script>
